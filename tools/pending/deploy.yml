name: Sync shop and deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 5 * * *" }]   # every day 05:17 UTC: fresh checkout links, prices and availability from the Squarespace shop
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sync with the Squarespace shop (direct checkout links, prices, availability)
        run: python3 tools/sync_shop.py
      - name: Generate the pages
        run: python3 gen.py
      - name: Commit the refreshed catalogue
        run: |
          git config user.name "Vivance Art" && git config user.email "vivance17paris@gmail.com"
          git add -A && (git diff --cached --quiet || git commit -m "Catalogue synchronise avec la boutique" ) && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
